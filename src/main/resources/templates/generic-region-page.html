<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${region}"></title>
</head>

<body>
    <h1 th:text="${region}"></h1>
    <ul>
        <li th:each="subDistrict: ${subDistricts}">
            <a th:href="@{'/region/' + ${region} + '/' + ${subDistrict.value}}"
               th:text="${subDistrict.key}"></a>
        </li>
    </ul>
</body>
</html>
