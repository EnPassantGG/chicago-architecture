<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Search</title>
</head>
<body>
    <form action="#" th:action="@{/search}" method="post">
        <label for="city"></label>
        <select name="city" id="city">
            <option th:each="city : ${cities}"
                    th:value="${city}"
                    th:text="${city}"></option>
        </select>
        <button type="submit">Search</button>
    </form>
</body>
</html>
