<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
</head>

<body>
    <h1 th:text="'Results for ' + ${city}"></h1>
    <ol th:number="1">
        <li th:each="building : ${results}">
            <p th:text="${building.getName()}"></p>
            <p th:text="${building.getAddress() + ', ' +
                              building.getCity() + ' (' +
                              building.getCreationYear() + ')'}"></p>
        </li>
    </ol>
</body>
</html>
