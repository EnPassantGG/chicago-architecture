<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>North Side</title>
</head>

<body>
    <h1>North Side!</h1>
    <h2>Subsections in the north side of Chicago</h2>
    <ul>
        <li th:each="subDistrict: ${northSideSubDistricts}">
            <a th:href="@{/downtown/{subDistrict}(subDistrict=${subDistrict.value})}"
               th:text="${subDistrict.key}"></a>
        </li>
    </ul>
</body>
</html>
