<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>North Side</title>
</head>

<body>
    <h1>West Side!</h1>
    <h2>Subsections in the west side of Chicago</h2>
    <ul>
        <li th:each="subDistrict: ${westSideSubDistricts}">
            <a th:href="@{/north_side/{subDistrict}(subDistrict=${subDistrict.value})}"
               th:text="${subDistrict.key}"></a>
        </li>
    </ul>
</body>
</html>
