<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>South Side</title>
</head>

<body>
    <h1>South Side!</h1>
    <h2>Subsections in the south side of Chicago</h2>
    <ul>
        <li th:each="subDistrict: ${southSideSubDistricts}">
            <a th:href="@{/south_side/{subDistrict}(subDistrict=${subDistrict.value})}"
               th:text="${subDistrict.key}"></a>
        </li>
    </ul>
</body>
</html>
