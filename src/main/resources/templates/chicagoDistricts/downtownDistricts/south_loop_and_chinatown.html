<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>South Loop & Chinatown</title>
</head>

<body>
<h1>Downtown - South Loop & Chinatown!</h1>
    <ol th:number="1">
        <li th:each="building : ${buildings}">
            <p th:text="${building.getName()}"></p>
            <p th:text="${building.getAddress() + ', ' +
                                      building.getCity() + ' (' +
                                      building.getCreationYear() + ')'}"></p>
        </li>
    </ol>
</body>
</html>
