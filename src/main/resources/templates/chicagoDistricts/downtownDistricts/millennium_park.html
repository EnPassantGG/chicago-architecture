<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Millennium Park</title>
</head>

<body>
    <h1>Downtown - Millennium Park!</h1>
    <ol th:number="1">
        <li th:each="building : ${buildings}">
            <p th:text="${building.getName()}"></p>
            <p th:text="${building.getAddress() + ', ' +
                              building.getCity() + ' (' +
                              building.getCreationYear() + ')'}"></p>
            <img th:src="@{${building.getImagePath()}}"
                 style="width: 300px; height: auto; border: 1px solid black"
                 alt="Building Image">
        </li>
    </ol>
</body>
</html>
