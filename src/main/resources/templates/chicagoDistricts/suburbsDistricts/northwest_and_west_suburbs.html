<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>North West and West Suburbs</title>
</head>

<body>
<h1>Suburbs - North West and West Suburbs!</h1>
<ol th:number="1">
    <li th:each="building : ${buildings}">
        <p th:text="${building.getName()}"></p>
        <p th:text="${building.getAddress() + ', ' +
                          building.getCity() + ' (' +
                          building.getCreationYear() + ')'}"></p>
    </li>
</ol>
</body>
</html>
